[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prismke"
version = "0.13.1.dev0"
description = "Schema-guided, evidence-aware multimodal knowledge graph construction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "PrismKE contributors" }]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "orjson>=3.10,<4",
  "pillow>=11,<13",
  "beautifulsoup4>=4.13,<5",
  "python-docx>=1.1,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
evaluation = [
  "openpyxl>=3.1,<4",
]
dev = [
  "mypy>=1.14,<2",
  "playwright>=1.55,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]
ocr = [
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
]
neo4j = [
  "neo4j>=5.26,<6",
]
web = [
  "fastapi>=0.115,<1",
  "gradio>=5,<7",
  "networkx>=3.4,<4",
  "plotly>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]
embedding = [
  "FlagEmbedding>=1.3,<2",
  "torch==2.6.0",
]

[project.scripts]
prismke = "src.cli:app"

[tool.hatch.build.targets.wheel]
only-include = ["src", "frontend", "assets/branding/prismke-logo-4k.png"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "browser: requires a locally installed Playwright Chromium browser",
  "libreoffice: requires a local LibreOffice Writer/headless installation",
  "neo4j: requires a live dedicated Neo4j database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "networkx",
  "networkx.*",
  "plotly",
  "plotly.*",
  "pymupdf",
  "pymupdf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "FlagEmbedding",
  "FlagEmbedding.*",
  "huggingface_hub",
  "huggingface_hub.*",
  "torch",
  "torch.*",
  "openpyxl",
  "openpyxl.*",
]
ignore_missing_imports = true
follow_imports = "skip"
