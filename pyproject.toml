[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prismke"
version = "0.2.0"
description = "Schema-guided, evidence-aware multimodal knowledge graph construction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "PrismKE contributors" }]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "orjson>=3.10,<4",
  "pillow>=11,<13",
  "beautifulsoup4>=4.13,<5",
  "python-docx>=1.1,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]
ocr = [
  "paddleocr>=3,<4",
  "paddlepaddle>=3,<4",
]

[project.scripts]
prismke = "prismke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prismke"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["prismke"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true
